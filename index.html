<script>
// A child may trace loosely, but the reward must wait until every part of the
// whole word has been attempted. Global coverage alone could accept a missing
// final letter, so completion is also gated by letter-sized horizontal zones.
coverSegment=function(a,b){
  const dist=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(dist/4));
  for(let i=0;i<=steps;i++){
    const x=a.x+(b.x-a.x)*i/steps,y=a.y+(b.y-a.y)*i/steps;
    for(let oy=-TOLERANCE;oy<=TOLERANCE;oy+=GRID)for(let ox=-TOLERANCE;ox<=TOLERANCE;ox+=GRID){
      const col=Math.floor((x+ox)/GRID),key=`${col},${Math.floor((y+oy)/GRID)}`;
      if(maskCells.has(key))coveredColumns.add(col);
    }
  }
  const columns=[...maskColumns].sort((x,y)=>x-y);
  const ratio=columns.length?coveredColumns.size/columns.length:0;
  const sectionCount=Math.max(1,(words[current]?.word||'').replace(/\s/g,'').length);
  const everySection=Array.from({length:sectionCount},(_,i)=>{
    const start=Math.floor(i*columns.length/sectionCount);
    const end=Math.max(start+1,Math.floor((i+1)*columns.length/sectionCount));
    const section=columns.slice(start,end);
    return section.length>0&&section.filter(col=>coveredColumns.has(col)).length/section.length>=.35;
  }).every(Boolean);
  const lastColumn=columns[columns.length-1];
  const reachesWordEnd=columns.slice(-Math.max(2,Math.ceil(columns.length*.08))).some(col=>coveredColumns.has(col))&&
    [...coveredColumns].some(col=>col>=lastColumn-1);
  const progress=Math.min(100,ratio/.68*100);
  $('#bar').style.width=Math.min(everySection&&reachesWordEnd?100:94,progress)+'%';
  if(ratio>=.68&&everySection&&reachesWordEnd&&!done)complete();
};
</script>
